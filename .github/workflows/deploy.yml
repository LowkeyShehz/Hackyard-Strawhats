name: Deploy AWS stack

# The app runs on Render (render.yaml), which deploys every push to main once CI passes.
# This workflow keeps the AWS side in step: DynamoDB tables, S3 buckets, the RenderRuntimeUser
# IAM user, and the original Lambda stack as a standby. It runs when template.yaml changes.
# AWS access uses GitHub OIDC, no stored keys.
on:
  push:
    branches: [main]
    paths: [template.yaml]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STACK_NAME: nirman-mitra-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Lambda packages are built from the repo root; keep non-runtime folders out of them
      - run: rm -rf admin-dashboard tests scripts data nodus agents docs
      - run: sam build
      - name: sam deploy
        env:
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NODUS_API_KEY: ${{ secrets.NODUS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FRAUD_SERVICE_TOKEN: ${{ secrets.FRAUD_SERVICE_TOKEN }}
          GPS_HASH_KEY: ${{ secrets.GPS_HASH_KEY }}
          AGENT_API_KEY_HASH: ${{ secrets.AGENT_API_KEY_HASH }}
          HELPLINE_SECRET: ${{ secrets.HELPLINE_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          ADMIN_SEED_SECRET: ${{ secrets.ADMIN_SEED_SECRET }}
          DEMO_PHONE_NUMBERS: ${{ secrets.DEMO_PHONE_NUMBERS }}
          CREDENTIAL_SIGNING_KEY: ${{ secrets.CREDENTIAL_SIGNING_KEY }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ELEVENLABS_VOICE_IDS: ${{ vars.ELEVENLABS_VOICE_IDS }}
          FRAUD_SERVICE_URL: ${{ vars.FRAUD_SERVICE_URL }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 --s3-prefix "$STACK_NAME" \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Environment=dev" \
              "CertificateThreshold=3" \
              "PortalUrl=$PORTAL_URL" \
              "DemoPhoneNumbers=$DEMO_PHONE_NUMBERS" \
              "CredentialSigningKey=$CREDENTIAL_SIGNING_KEY" \
              "WhatsAppApiToken=$WHATSAPP_API_TOKEN" \
              "WhatsAppPhoneNumberId=$WHATSAPP_PHONE_NUMBER_ID" \
              "WhatsAppVerifyToken=$WHATSAPP_VERIFY_TOKEN" \
              "WhatsAppAppSecret=$WHATSAPP_APP_SECRET" \
              "GroqApiKey=$GROQ_API_KEY" \
              "NodusApiKey=$NODUS_API_KEY" \
              "LlmProvider=${LLM_PROVIDER:-nodus}" \
              "LlmModel=${LLM_MODEL:-nodus/gpt-oss-120b}" \
              "ElevenLabsApiKey=$ELEVENLABS_API_KEY" \
              "ElevenLabsVoiceIds=$ELEVENLABS_VOICE_IDS" \
              "FraudServiceUrl=$FRAUD_SERVICE_URL" \
              "FraudServiceToken=$FRAUD_SERVICE_TOKEN" \
              "GpsHashKey=$GPS_HASH_KEY" \
              "AgentApiKeyHash=$AGENT_API_KEY_HASH" \
              "HelplineSecret=$HELPLINE_SECRET" \
              "JwtSecret=$JWT_SECRET" \
              "JwtRefreshSecret=$JWT_REFRESH_SECRET" \
              "AdminSeedSecret=$ADMIN_SEED_SECRET"

