# Nightly fraud sweep on Nodus.
#   nodus secret create nirman-db --from-env-file db.env   (DATABASE_URL: the Render Postgres
#                                                           external connection string)
#   nodus apply -f nodus/jobs/fraud_sweep.yaml
#   nodus cp job/nirman-fraud-sweep:outputs/report ./report.json
# For the DynamoDB (Lambda) deployment, use a secret with AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY instead; that key needs only dynamodb:Scan on both tables and
# dynamodb:UpdateItem on AttendanceLogs.
apiVersion: nodus.dev/v1
kind: Job
metadata:
  name: nirman-fraud-sweep
spec:
  image: nodus/pytorch
  secrets: [nirman-db]
  env:
    - name: AWS_REGION
      value: ap-south-1
    - name: ATTENDANCE_TABLE
      value: NirmanMitra-AttendanceLogs-dev
    - name: WORKERS_TABLE
      value: NirmanMitra-Workers-dev
    - name: SWEEP_DAYS
      value: "14"
  command:
    - sh
    - -c
    - cd nodus && pip install -q numpy pillow boto3 "psycopg[binary]" && python sweep.py
  resources:
    cpu: 2
    memory: 4Gi
  timeout: 20m
  maxCostUSD: "0.50"
  outputs:
    - name: report
      path: /nodus/outputs/report.json
