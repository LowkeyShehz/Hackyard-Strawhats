# Nirman Mitra on Render (Blueprint). Every service deploys from main once GitHub CI
# (.github/workflows/ci.yml) passes.
#   Data:   Render Postgres (DB_BACKEND=postgres, src/utils/postgres.js)
#   Files:  the API's Render disk, served as signed /files/ links (STORAGE_BACKEND=disk)
#   OCR:    RapidOCR on the bridge (OCR_PROVIDER=bridge), Tesseract in the API as the fallback
#   Voice:  ElevenLabs only (TTS_FALLBACK=none)
#   Faces:  OpenCV SFace on the face + fraud bridge (FACE_PROVIDER=bridge). No AWS anywhere.
#   AI:     Groq until NODUS_API_KEY is set; then LLM, speech-to-text, faces and fraud checks
#           move to Nodus Compute with no code change (see docs/NODUS_SWITCH.md)
#
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is first
# applied, and they are then edited in the dashboard, never here.

databases:
  - name: nirman-mitra-db
    databaseName: nirman_mitra
    user: nirman
    region: singapore
    plan: 0.1c-256mb

envVarGroups:
  # Non-secret settings shared by the API and the reminder job. Table names match template.yaml;
  # on Postgres they are the `tbl` value of each row.
  - name: nirman-mitra-backend
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: ENVIRONMENT
        value: dev
      - key: DB_BACKEND
        value: postgres
      - key: AWS_REGION
        value: ap-south-1
      - key: WORKERS_TABLE
        value: NirmanMitra-Workers-dev
      - key: ATTENDANCE_TABLE
        value: NirmanMitra-AttendanceLogs-dev
      - key: SITES_TABLE
        value: NirmanMitra-Sites-dev
      - key: CERTIFICATES_TABLE
        value: NirmanMitra-Certificates-dev
      - key: DOCUMENTS_TABLE
        value: NirmanMitra-Documents-dev
      - key: CONVERSATION_TABLE
        value: NirmanMitra-ConversationState-dev
      - key: BEDROCK_CACHE_TABLE
        value: NirmanMitra-BedrockCache-dev
      - key: ADMIN_USERS_TABLE
        value: NirmanMitra-AdminUsers-dev
      - key: REFRESH_TOKENS_TABLE
        value: NirmanMitra-RefreshTokens-dev
      - key: AUDIT_TABLE
        value: NirmanMitra-AuditLog-dev

services:
  # ── API: WhatsApp webhook + dashboard/officer/agent/helpline API (src/server.js) ──
  - type: web
    name: nirman-mitra-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    # Worker media, certificates, cached voice replies and the Tesseract language data. A disk
    # pins the API to one instance, and deploys briefly stop it (no zero-downtime deploys). It
    # also rules out maxShutdownDelaySeconds, so in-flight webhook work gets Render's default
    # shutdown window after SIGTERM.
    disk:
      name: nirman-files
      mountPath: /var/data
      sizeGB: 1
    buildFilter:
      paths:
        - src/**
        - package.json
        - package-lock.json
    envVars:
      - fromGroup: nirman-mitra-backend
      - key: DATABASE_URL
        fromDatabase:
          name: nirman-mitra-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: disk
      - key: STORAGE_DIR
        value: /var/data/files
      # Signs the expiring /files/ links (WhatsApp fetches voice notes and certificates by URL)
      - key: FILE_URL_SECRET
        generateValue: true
      - key: OCR_PROVIDER
        value: bridge
      - key: TTS_FALLBACK
        value: none
      - key: BACKGROUND_WEBHOOK
        value: 'true'
      - key: CERTIFICATE_THRESHOLD
        value: '3'
      - key: FACE_PROVIDER
        value: bridge
      - key: STT_PROVIDERS
        value: nodus,elevenlabs,groq
      - key: ELEVENLABS_TTS_MODEL
        value: eleven_v3
      - key: LLM_PROVIDER
        value: nodus
      - key: LLM_MODEL
        value: nodus/gpt-oss-120b
      - key: PORTAL_URL
        sync: false
      - key: DEMO_PHONE_NUMBERS
        sync: false
      - key: CREDENTIAL_SIGNING_JWK
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Leave empty until Nodus access arrives: the LLM runs on Groq and speech-to-text on
      # ElevenLabs/Groq. Setting it moves both to Nodus.
      - key: NODUS_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # {"en":"<voice id>","hi":"<voice id>"}; other languages get text-only replies
      - key: ELEVENLABS_VOICE_IDS
        sync: false
      # https://nirman-fraud-bridge.onrender.com. Required: face matching runs on the bridge
      - key: FRAUD_SERVICE_URL
        sync: false
      - key: FRAUD_SERVICE_TOKEN
        sync: false
      - key: GPS_HASH_KEY
        sync: false
      - key: AGENT_API_KEY_HASH
        sync: false
      - key: HELPLINE_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_SEED_SECRET
        sync: false

  # ── Proactive WhatsApp reminders (was the EventBridge schedule on Lambda) ──
  - type: cron
    name: nirman-mitra-reminders
    runtime: node
    region: singapore
    schedule: '*/15 * * * *'
    buildCommand: npm ci --omit=dev
    startCommand: node src/jobs/proactiveReminder.js
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - src/**
        - package.json
        - package-lock.json
    envVars:
      - fromGroup: nirman-mitra-backend
      - key: DATABASE_URL
        fromDatabase:
          name: nirman-mitra-db
          property: connectionString
      - key: WHATSAPP_REMINDER_TEMPLATE_NAME
        value: daily_checkin_reminder
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  # ── Nodus fraud bridge (nodus/bridge.py); the models run on Nodus, not here ──
  - type: web
    name: nirman-fraud-bridge
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: nodus
    # Fetches the YuNet + SFace face models (~38 MB) into nodus/models at build time
    buildCommand: pip install -r requirements-bridge.txt && pip install --no-deps rapidocr-onnxruntime && python -c "import face; face.ensure_models()"
    startCommand: uvicorn bridge:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Same value as the API's FRAUD_SERVICE_TOKEN
      - key: FRAUD_SERVICE_TOKEN
        sync: false
      # Leave empty for now: SFace, pHash and the recapture check run here on CPU. Once
      # nodus/app.py is deployed, setting this moves them to Nodus (falls back to CPU on errors).
      # Credentials for the Nodus SDK (what `nodus login` stores locally).
      - key: NODUS_API_KEY
        sync: false

  # ── Nightly fraud sweep (nodus/sweep.py) at 02:00 IST. Runs here on CPU until Nodus access;
  #    then it moves to the Nodus job in nodus/jobs/fraud_sweep.yaml and this cron is suspended ──
  - type: cron
    name: nirman-fraud-sweep
    runtime: python
    region: singapore
    schedule: '30 20 * * *'
    rootDir: nodus
    buildCommand: pip install numpy pillow "psycopg[binary]"
    startCommand: python sweep.py
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: nirman-mitra-backend
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: nirman-mitra-db
          property: connectionString

  # ── Admin dashboard / officer portal (static) ──
  - type: web
    name: nirman-mitra-admin
    runtime: static
    rootDir: admin-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      # React Router; real files such as /.well-known/did.json are served as they are
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # https://nirman-mitra-api.onrender.com (read at build time by Vite)
      - key: VITE_API_URL
        sync: false
